<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">

        <div class="logo">
            <h2>
                Product<span>Hub</span>
            </h2>
        </div>

        <nav>
            <button class="nav-btn active" id="homeBtn">
                <span>🏠</span>
                All Products
            </button>
        </nav>

        <div class="sidebar-bottom">
            <h4>Product CRUD</h4>
            <p>JavaScript + LocalStorage</p>
        </div>

    </aside>

    <main class="main">
        <header class="header">
            <div>
                <h1 id="pageTitle">
                    All Products
                </h1>

                <p>
                    Manage your products easily
                </p>

            </div>

            <button id="addProductBtn" class="top-add-btn">
                + Add Product
            </button>

        </header>

        <section id="productsPage">

            <div class="tools">

                <div class="search-box">

                    <span>🔍</span>

                    <input type="text" id="searchInput" placeholder="Search product by name...">

                </div>

                <select id="sortSelect">

                    <option value="default">
                        Sort Products
                    </option>

                    <option value="low">
                        Price Low to High
                    </option>

                    <option value="high">
                        Price High to Low
                    </option>

                </select>

            </div>

            <div class="product-heading">

                <h2>
                    Products
                </h2>

                <span id="productCount">
                    10 Products
                </span>

            </div>

            <div id="productList" class="product-list"></div>

        </section>

        <section id="addPage" class="add-page">

            <div class="form-card">

                <div class="form-header">

                    <div>

                        <h2 id="formTitle">
                            Add New Product
                        </h2>

                        <p>
                            Enter product details
                        </p>

                    </div>

                    <button class="close-btn" id="closeFormBtn">
                        ✕
                    </button>

                </div>

                <form id="productForm">

                    <div class="form-group">

                        <label>
                            Product Name
                        </label>

                        <input type="text" id="productName" placeholder="Enter product name">

                        <small id="nameError" class="error"></small>

                    </div>

                    <div class="form-group">

                        <label>
                            Product Price
                        </label>

                        <input type="number" id="productPrice" placeholder="Enter product price" min="1">

                        <small id="priceError" class="error"></small>

                    </div>

                    <div class="form-group">

                        <label>
                            Product Image URL
                        </label>

                        <input type="text" id="productImage" placeholder="Enter image URL">

                    </div>

                    <div class="form-buttons">

                        <button type="button" class="cancel-btn" id="cancelBtn">
                            Cancel
                        </button>

                        <button type="submit" class="submit-btn" id="submitBtn">
                            Add Product
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
